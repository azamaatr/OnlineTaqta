<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fb"><title>OnlineTaqta — онлайн тақта</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script src="./script.js" defer></script></head><body>
<header class="header"><div class="brand"><span class="logo">▣</span><b>OnlineTaqta</b><span class="brand-sub">Тақта</span></div><div class="title-wrap"><input id="title" aria-label="Тақта атауы" maxlength="80" value="Жаңа тақта"><span id="status">Дайын</span></div><div class="header-right"><button id="undo" class="icon-btn" title="Болдырмау ⌘Z" aria-label="Болдырмау">↶</button><button id="redo" class="icon-btn" title="Қайталау ⌘⇧Z" aria-label="Қайталау">↷</button><span class="separator"></span><button id="clearBoard" class="text-btn" title="Ағымдағы тақтаны толық тазалау">Тазалау</button><button id="boards" class="text-btn">Тақталар</button><button id="export" class="primary">Сақтау <span>↗</span></button></div></header>
<main id="workspace"><canvas id="canvas" aria-label="Сурет салу тақтасы"></canvas><div class="grid-overlay" aria-hidden="true"></div><div id="empty" class="empty"><div class="empty-icon">✎</div><strong>Ойыңызды еркін жазыңыз</strong><span>Қаламды таңдап, тақтаға жазыңыз</span></div>
<nav class="toolbar" aria-label="Құралдар"><button data-tool="select" title="Таңдау (V)" aria-label="Таңдау">↖</button><button data-tool="pan" title="Жылжыту (H)" aria-label="Жылжыту">✥</button><i></i><button data-tool="pen" class="active" title="Қалам (P)" aria-label="Қалам">✎</button><button data-tool="eraser" title="Өшіргіш (E)" aria-label="Өшіргіш"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M20.5 13.5 12 22H5l-3-3a2 2 0 0 1 0-2.8L14.2 4a2 2 0 0 1 2.8 0l3.5 3.5a2 2 0 0 1 0 2.8Z"/><path d="m8 10 7 7M12 22h10"/></svg></button><i></i><button data-tool="line" title="Сызық (L)" aria-label="Сызық">╱</button><button data-tool="arrow" title="Көрсеткі (A)" aria-label="Көрсеткі">↗</button><button data-tool="rect" title="Тіктөртбұрыш (R)" aria-label="Тіктөртбұрыш">▢</button><button data-tool="ellipse" title="Шеңбер (O)" aria-label="Шеңбер">◯</button><i></i><button data-tool="text" title="Мәтін (T)" aria-label="Мәтін">T</button><button id="image" title="Сурет қосу" aria-label="Сурет қосу">▧</button><button id="screenshot" title="Скриншот қою (файл таңдау). Mac: ⌘⇧4, кейін ⌘V" aria-label="Скриншот қою">▣</button><input id="imageFile" type="file" accept="image/*" hidden></nav>
<div id="properties" class="properties"><div class="colors"><button class="color active" data-color="#172033" style="--c:#172033" aria-label="Қара"></button><button class="color" data-color="#315cf6" style="--c:#315cf6" aria-label="Көк"></button><button class="color" data-color="#e54a4a" style="--c:#e54a4a" aria-label="Қызыл"></button><button class="color" data-color="#139779" style="--c:#139779" aria-label="Жасыл"></button><label class="custom-color" title="Түс таңдау"><input id="color" type="color" value="#172033"></label></div><span class="prop-sep"></span><label class="width-label">Қалыңдық <input id="width" type="range" min="1" max="28" value="3"><output id="widthValue">3</output></label><label id="pressureLabel" class="pressure"><input id="pressure" type="checkbox"> Қысым</label><button id="delete" class="delete" hidden>Жою</button></div>
<div class="bottom-left"><button id="background" title="Фон түрін ауыстыру">▦ <span id="bgName">Тор</span></button><button id="help" title="Қолдану нұсқаулығы">?</button></div><div class="zoom"><button id="zoomOut" aria-label="Кішірейту">−</button><button id="zoomValue" title="100%">100%</button><button id="zoomIn" aria-label="Үлкейту">+</button><button id="fit" title="Бастапқы көрініс">⌗</button></div><div id="cursor" hidden></div><div id="toast" role="status"></div></main>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Жабу">×</button></div><div id="dialogBody"></div></dialog>
</body></html>
